plugins {    id 'java'}group = 'safronova'version = '1.0-SNAPSHOT'repositories {    mavenCentral()}dependencies {    testImplementation platform('org.junit:junit-bom:5.10.0')    testImplementation 'org.junit.jupiter:junit-jupiter'    testImplementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.29.0'}test {    useJUnitPlatform()  // Использование JUnit Platform для запуска тестов   // maxParallelForks = 4 // Количество потоков для параллельного запуска тестов}